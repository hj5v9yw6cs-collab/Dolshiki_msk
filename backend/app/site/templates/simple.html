{% extends "base.html" %}
{% block content %}
<section class="hero hero--slim">
  <div class="wrap wrap--narrow">
    <h1>{{ page.h1 }}</h1>
    {% if page.lead %}<p class="hero__lead">{{ page.lead }}</p>{% endif %}
  </div>
</section>

<section class="section">
  <div class="wrap wrap--narrow">
    {% block body %}{% endblock %}
  </div>
</section>

{% if with_form | default(true) %}{% include "_form.html" %}{% endif %}
{% endblock %}
